<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube RAG Summarizer</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232734;
    --border: #2d3142;
    --text: #e4e6f0;
    --text-dim: #8b8fa3;
    --accent: #6c63ff;
    --accent-hover: #5a52e0;
    --green: #2ecc71;
    --red: #e74c3c;
    --orange: #f39c12;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header h1 span { color: var(--accent); }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 6px;
  }
  .status-dot.ok { background: var(--green); }
  .status-dot.err { background: var(--red); }
  .status-dot.warn { background: var(--orange); }
  .status-dot.off { background: var(--text-dim); }

  .layout {
    display: flex;
    height: calc(100vh - 57px);
  }
  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h2 { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .video-list { flex: 1; overflow-y: auto; padding: 8px; }
  .video-item {
    padding: 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }
  .video-item:hover { background: var(--surface2); }
  .video-item.active { background: var(--accent); color: white; }
  .video-item .title {
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .video-item .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .video-item.active .meta { color: rgba(255,255,255,0.7); }

  .ingest-form {
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  .ingest-form input {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .ingest-form input:focus { border-color: var(--accent); }
  .ingest-form button {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ingest-form button:hover { background: var(--accent-hover); }
  .ingest-form button:disabled { opacity: 0.5; cursor: not-allowed; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
  }
  .tab {
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { flex: 1; overflow-y: auto; }
  .tab-panel { display: none; height: 100%; flex-direction: column; }
  .tab-panel.active { display: flex; }

  /* Chat */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .chat-msg {
    max-width: 800px;
    margin: 0 auto 16px;
  }
  .chat-msg.user { text-align: right; }
  .chat-msg .bubble {
    display: inline-block;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    max-width: 80%;
    text-align: left;
    white-space: pre-wrap;
  }
  .chat-msg.user .bubble { background: var(--accent); color: white; }
  .chat-msg.assistant .bubble { background: var(--surface2); border: 1px solid var(--border); }
  .chat-msg .timestamp {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .chat-input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    max-width: 800px;
    margin: 0 auto;
  }
  .chat-input-row input {
    flex: 1;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .chat-input-row input:focus { border-color: var(--accent); }
  .chat-input-row button {
    padding: 12px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .chat-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Transcript */
  .transcript-panel { padding: 20px; }
  .segment {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .segment .time {
    color: var(--accent);
    font-size: 12px;
    font-family: monospace;
    white-space: nowrap;
    min-width: 60px;
    cursor: pointer;
  }
  .segment .time:hover { text-decoration: underline; }
  .segment .text { font-size: 14px; line-height: 1.6; }

  /* Search */
  .search-panel { padding: 20px; }
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .search-row input {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .search-row button {
    padding: 10px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
  }
  .search-result {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .search-result .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .search-result .result-time {
    color: var(--accent);
    font-family: monospace;
    font-size: 12px;
  }
  .search-result .result-score {
    background: var(--surface);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .search-result .result-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .search-result .result-summary {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    font-style: italic;
  }
  .search-result .result-keywords {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .search-result .keyword {
    background: var(--surface);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--accent);
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    gap: 8px;
  }
  .empty-state .icon { font-size: 48px; opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    animation: progress 2s ease-in-out infinite;
    width: 30%;
  }
  @keyframes progress {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<div class="header">
  <h1><span>&#9654;</span> YouTube RAG Summarizer</h1>
  <div id="health-status" style="font-size: 13px;">
    <span class="status-dot off"></span> Checking...
  </div>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Videos</h2>
    </div>
    <div class="video-list" id="video-list">
      <div class="empty-state" style="height: auto; padding: 40px 0;">
        <p>No videos yet</p>
      </div>
    </div>
    <div class="ingest-form">
      <input type="text" id="ingest-url" placeholder="Paste YouTube URL..." />
      <button id="ingest-btn" onclick="ingestVideo()">Ingest Video</button>
      <div id="ingest-progress" style="display: none;">
        <div class="progress-bar"><div class="fill"></div></div>
        <p style="font-size: 11px; color: var(--text-dim); margin-top: 6px; text-align: center;" id="ingest-status">Starting...</p>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="main">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="chat" onclick="switchTab('chat')">Chat</div>
      <div class="tab" data-tab="transcript" onclick="switchTab('transcript')">Transcript</div>
      <div class="tab" data-tab="search" onclick="switchTab('search')">Search</div>
    </div>
    <div class="tab-content">
      <!-- Chat panel -->
      <div class="tab-panel active" id="panel-chat">
        <div class="chat-messages" id="chat-messages">
          <div class="empty-state" id="chat-empty">
            <div class="icon">&#128172;</div>
            <p>Select a video and ask a question</p>
          </div>
        </div>
        <div class="chat-input-area">
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Ask a question about the video..." onkeydown="if(event.key==='Enter')sendChat()" />
            <button id="chat-send-btn" onclick="sendChat()">Send</button>
          </div>
        </div>
      </div>

      <!-- Transcript panel -->
      <div class="tab-panel" id="panel-transcript">
        <div class="transcript-panel" id="transcript-content">
          <div class="empty-state">
            <div class="icon">&#128196;</div>
            <p>Select a video to view its transcript</p>
          </div>
        </div>
      </div>

      <!-- Search panel -->
      <div class="tab-panel" id="panel-search">
        <div class="search-panel">
          <div class="search-row">
            <input type="text" id="search-input" placeholder="Search chunks..." onkeydown="if(event.key==='Enter')searchChunks()" />
            <button onclick="searchChunks()">Search</button>
          </div>
          <div id="search-results"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';
let currentVideoId = null;

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  await checkHealth();
  await loadVideos();
  setInterval(checkHealth, 30000);
}

// ── Health ────────────────────────────────────────────────────────
async function checkHealth() {
  const el = document.getElementById('health-status');
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    const allOk = d.qdrant?.status === 'healthy';
    el.innerHTML = `<span class="status-dot ${allOk ? 'ok' : 'warn'}"></span> ${allOk ? 'All systems up' : 'Partial'}`;
  } catch {
    el.innerHTML = '<span class="status-dot err"></span> Server offline';
  }
}

// ── Video List ────────────────────────────────────────────────────
async function loadVideos() {
  const list = document.getElementById('video-list');
  try {
    const r = await fetch(`${API}/videos`);
    const videos = await r.json();
    if (!videos.length) {
      list.innerHTML = '<div class="empty-state" style="height: auto; padding: 40px 0;"><p>No videos yet</p></div>';
      return;
    }
    list.innerHTML = videos.map(v => `
      <div class="video-item ${v.video_id === currentVideoId ? 'active' : ''}"
           onclick="selectVideo('${v.video_id}')">
        <div class="title">${esc(v.title || v.video_id)}</div>
        <div class="meta">${v.status} ${v.duration ? '| ' + fmtDur(v.duration) : ''}</div>
      </div>
    `).join('');
  } catch {
    list.innerHTML = '<div class="empty-state" style="height: auto; padding: 40px 0;"><p>Error loading videos</p></div>';
  }
}

// ── Select Video ──────────────────────────────────────────────────
async function selectVideo(id) {
  currentVideoId = id;
  loadVideos();
  loadTranscript(id);
  document.getElementById('chat-empty').style.display = 'none';
  document.getElementById('chat-input').focus();
}

// ── Ingest ────────────────────────────────────────────────────────
async function ingestVideo() {
  const url = document.getElementById('ingest-url').value.trim();
  if (!url) return;

  const btn = document.getElementById('ingest-btn');
  const prog = document.getElementById('ingest-progress');
  const status = document.getElementById('ingest-status');

  btn.disabled = true;
  btn.textContent = 'Ingesting...';
  prog.style.display = 'block';
  status.textContent = 'Starting ingestion...';

  try {
    const r = await fetch(`${API}/videos`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const d = await r.json();
    if (r.ok) {
      status.textContent = `Done! Video ID: ${d.video_id}`;
      document.getElementById('ingest-url').value = '';
      currentVideoId = d.video_id;
      await loadVideos();
      await selectVideo(d.video_id);
    } else {
      status.textContent = `Error: ${d.detail || 'Unknown error'}`;
    }
  } catch (e) {
    status.textContent = `Error: ${e.message}`;
  }

  btn.disabled = false;
  btn.textContent = 'Ingest Video';
  setTimeout(() => { prog.style.display = 'none'; }, 5000);
}

// ── Chat ──────────────────────────────────────────────────────────
async function sendChat() {
  if (!currentVideoId) return;
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if (!q) return;

  const msgs = document.getElementById('chat-messages');
  const empty = document.getElementById('chat-empty');
  if (empty) empty.style.display = 'none';

  // Add user message
  msgs.innerHTML += `<div class="chat-msg user"><div class="bubble">${esc(q)}</div></div>`;

  // Add loading
  const loadId = 'load-' + Date.now();
  msgs.innerHTML += `<div class="chat-msg assistant" id="${loadId}"><div class="bubble"><span class="spinner"></span></div></div>`;
  msgs.scrollTop = msgs.scrollHeight;

  input.value = '';
  document.getElementById('chat-send-btn').disabled = true;

  try {
    const r = await fetch(`${API}/videos/${currentVideoId}/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const d = await r.json();
    const loadEl = document.getElementById(loadId);
    if (r.ok) {
      loadEl.querySelector('.bubble').textContent = d.answer;
    } else {
      loadEl.querySelector('.bubble').textContent = `Error: ${d.detail}`;
    }
  } catch (e) {
    const loadEl = document.getElementById(loadId);
    if (loadEl) loadEl.querySelector('.bubble').textContent = `Error: ${e.message}`;
  }

  document.getElementById('chat-send-btn').disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}

// ── Transcript ────────────────────────────────────────────────────
async function loadTranscript(id) {
  const el = document.getElementById('transcript-content');
  el.innerHTML = '<div class="empty-state"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div><p>Loading transcript...</p></div>';

  try {
    const r = await fetch(`${API}/videos/${id}/transcript`);
    if (!r.ok) throw new Error('Not found');
    const d = await r.json();
    if (!d.segments || !d.segments.length) {
      el.innerHTML = '<div class="empty-state"><p>No transcript available</p></div>';
      return;
    }
    el.innerHTML = d.segments.map(s => `
      <div class="segment">
        <div class="time" onclick="copyTimestamp(${s.start})">${fmtTime(s.start)}</div>
        <div class="text">${esc(s.text)}</div>
      </div>
    `).join('');
  } catch {
    el.innerHTML = '<div class="empty-state"><p>Could not load transcript</p></div>';
  }
}

function copyTimestamp(sec) {
  const input = document.getElementById('chat-input');
  input.value += ` [${fmtTime(sec)}] `;
  input.focus();
  switchTab('chat');
}

// ── Search ────────────────────────────────────────────────────────
async function searchChunks() {
  if (!currentVideoId) return;
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;

  const el = document.getElementById('search-results');
  el.innerHTML = '<div class="empty-state"><div class="spinner" style="width:24px;height:24px;border-width:2px;"></div></div>';

  try {
    const r = await fetch(`${API}/videos/${currentVideoId}/search`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const results = await r.json();
    if (!results.length) {
      el.innerHTML = '<div class="empty-state"><p>No results found</p></div>';
      return;
    }
    el.innerHTML = results.map(r => `
      <div class="search-result">
        <div class="result-header">
          <div class="result-time">${fmtTime(r.start)} - ${fmtTime(r.end)}</div>
          <div class="result-score">score: ${r.score}</div>
        </div>
        ${r.summary ? `<div class="result-summary">${esc(r.summary)}</div>` : ''}
        <div class="result-text">${esc(r.text)}</div>
        ${r.keywords?.length ? `<div class="result-keywords">${r.keywords.map(k => `<span class="keyword">${esc(k)}</span>`).join('')}</div>` : ''}
      </div>
    `).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><p>Error: ${esc(e.message)}</p></div>`;
  }
}

// ── Tabs ──────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${name}`));
}

// ── Helpers ───────────────────────────────────────────────────────
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtDur(s) { const m = Math.floor(s / 60); return m > 59 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m ${Math.floor(s%60)}s`; }
function fmtTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
}

init();
</script>
</body>
</html>
