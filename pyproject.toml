[project]
name = "youtube-rag"
version = "0.1.0"
description = "Fully local YouTube video ingestion, summarization, and RAG Q&A system."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.1.0",
    "qdrant-client>=1.12.0",
    "faster-whisper>=1.1.0",
    "rich>=15.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
